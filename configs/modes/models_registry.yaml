# Benchmark với model registry (optional)
source: data/sample.mp4
slots_path: configs/slots/parking_lot_01.json

models:
  active: yolo11n-default
  registry:
    - id: yolo11n-default
      path: models/yolo11n.pt
      backend: pytorch
      status: approved

mlflow:
  experiment_name: smart-parking

pipeline:
  mode: benchmark
  layers:
    detr: false
    yolo: true
    fusion: false
    overlay: false
    minimap: false

detection:
  model_path: models/yolo11n.pt
  device: "0"

ui:
  enabled: false

inspector:
  enabled: false
