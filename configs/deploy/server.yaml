# Kịch bản B: server GPU — nguồn RTSP từ client
# Đổi CLIENT_IP và path stream
# queue_max: 1 + drop_frames_in_realtime: true → luôn infer frame mới nhất (live)
source: rtsp://CLIENT_IP:8554/parking
slots_path: configs/slots/parking_lot_01.json

pipeline:
  mode: normal
  camera_id: remote-parking-01
  queue_max: 1
  drop_frames_in_realtime: true
  stop_on_stage_error: true
  layers:
    detr: false
    yolo: true
    fusion: false
    tracking: true
    occupancy: true
    overlay: false
    minimap: false

detection:
  backend: pytorch
  model_path: models/parking_yolo11.pt
  device: "0"
  imgsz: 640
  confidence: 0.35

ui:
  enabled: false

inspector:
  enabled: true
  host: 127.0.0.1
  port: 8765

artifacts:
  enabled: true
  directory: logs/artifacts
  max_frames: 200
  sample_every_n: 15

analytics:
  log_path: logs/events.jsonl
  alerts:
    enabled: true
    log_path: logs/alerts.jsonl
    cooldown_seconds: 30.0
    on_ingest_degraded: true
    on_ingest_unhealthy: true
    on_model_unhealthy: true
    on_slot_stale: true
