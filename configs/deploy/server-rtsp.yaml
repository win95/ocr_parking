# Server GPU — kéo RTSP từ laptop client (kịch bản B)
# Đổi LAPTOP_IP trước khi chạy
source: rtsp://LAPTOP_IP:8554/parking
slots_path: configs/slots/parking_lot_01.json

ingest:
  rtsp_transport: tcp
  connect_timeout_ms: 8000
  reconnect: true
  reconnect_delay_seconds: 3.0
  max_reconnects: null

pipeline:
  mode: normal
  camera_id: laptop-rtsp-01
  queue_max: 1
  drop_frames_in_realtime: true
  layers:
    detr: false
    yolo: true
    fusion: false
    tracking: true
    occupancy: true
    overlay: false
    minimap: true

detection:
  backend: pytorch
  model_path: yolo11n.pt
  device: "0"
  imgsz: 640
  confidence: 0.35

ui:
  enabled: false

inspector:
  enabled: true
  host: 127.0.0.1
  port: 8765

artifacts:
  enabled: true
  directory: logs/artifacts
  max_frames: 100
  sample_every_n: 30

analytics:
  log_path: logs/events.jsonl

smoothing:
  window: 15
  t_on: 10
  t_off: 12

tracking:
  coast_frames: 8
  iou_threshold: 0.3
