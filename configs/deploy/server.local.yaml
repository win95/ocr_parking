# Kịch bản B: server GPU — nguồn RTSP từ client
# Đổi CLIENT_IP và path stream
source: rtsp://192.168.100.234:8554/parking
slots_path: configs/slots/parking_lot_01.json

ingest:
  rtsp_transport: tcp
  connect_timeout_ms: 8000
  reconnect: true
  reconnect_delay_seconds: 3.0
  max_reconnects: null

pipeline:
  mode: normal
  camera_id: remote-parking-01
  queue_max: 1
  drop_frames_in_realtime: true
  stop_on_stage_error: true
  layers:
    detr: false
    yolo: true
    fusion: false
    tracking: true
    occupancy: true
    overlay: false
    minimap: false

detection:
  backend: pytorch
  model_path: models/yolo11n.pt
  device: "0"
  imgsz: 640
  confidence: 0.35

ui:
  enabled: false

inspector:
  enabled: true
  host: 0.0.0.0
  port: 8765
  # Loopback luôn được phép; thêm subnet LAN/VPN được phép truy cập.
  allow_networks:
    - 127.0.0.0/8
    - ::1/128
    - 192.168.100.0/24
  # Đặt token qua env thay vì ghi vào file:
  #   export SMART_PARKING_INSPECTOR_TOKEN=...
  # Dashboard: http://<server>:8765/?token=<token>

artifacts:
  enabled: true
  directory: logs/artifacts
  max_frames: 200
  sample_every_n: 15

analytics:
  log_path: logs/events.jsonl
  alerts:
    enabled: true
    log_path: logs/alerts.jsonl
    cooldown_seconds: 30.0
    on_ingest_degraded: true
    on_ingest_unhealthy: true
    on_model_unhealthy: true
    on_slot_stale: true
